{% load store_extras %}{% if product.image %}<img class="{{ css_class|default:'product-photo' }}" src="{{ product.image.url }}" alt="{{ product.name }}" loading="lazy">{% else %}<div class="product-placeholder tone-{{ product.category_id|tone }} {{ css_class|default:'product-photo' }}" role="img" aria-label="{{ product.name }} (photo coming soon)"><span aria-hidden="true">{{ product.initials }}</span></div>{% endif %}
