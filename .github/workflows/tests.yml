# Runs on every push and pull request: PEP 8, migrations check and the full
# test suite on SQLite and on PostgreSQL (where the threaded cancellation
# tests run with real row locks).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt flake8
      - name: flake8 (PEP 8)
        run: python -m flake8
      - name: ESLint (JavaScript)
        run: |
          npm i --no-save eslint@9.17.0 @eslint/js@9.17.0 globals@15.14.0
          npx eslint static/js
      - name: Models match migrations
        run: DEBUG=True python manage.py makemigrations --check --dry-run
      - name: Tests on SQLite
        run: |
          set -o pipefail
          python manage.py test -v 2 2>&1 | tee sqlite.txt
      - name: Tests on PostgreSQL (includes simultaneous cancellation tests)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/joy2buy
        run: |
          set -o pipefail
          python manage.py test -v 2 2>&1 | tee postgres.txt
      # Puts the result lines on the run's summary page as annotations.
      - name: Summary annotations
        if: always()
        run: |
          for db in sqlite postgres; do
            [ -f "$db.txt" ] || continue
            ran=$(grep -E '^Ran [0-9]+ tests' "$db.txt" | tail -n 1)
            result=$(grep -E '^(OK|FAILED)' "$db.txt" | tail -n 1)
            echo "::notice title=Tests on $db::$ran - $result"
          done
